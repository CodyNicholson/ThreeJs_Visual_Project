server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # This lab has no backend: the demos run Three.js in the browser
    client_max_body_size 16k;

    # Hashed build assets never change, so let browsers cache them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Textures and models must 404 when missing instead of falling back to index.html: a loader
    # that receives the HTML page fails with a confusing JSON / image decode error (see #gltf).
    location ~* \.(png|jpe?g|webp|ktx2|hdr|exr|glb|gltf|bin)$ {
        try_files $uri =404;
        expires 1h;
    }

    # Client-side routing: unknown paths fall back to the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}

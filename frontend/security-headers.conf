# Included at server level AND in every location that has its own add_header: nginx drops the
# inherited add_header directives as soon as a location declares one.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Everything is served from this origin. data:/blob: cover glTF buffers and images that GLTFLoader
# reads from data URIs and object URLs; React sets inline styles through the CSSOM, which CSP allows.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
